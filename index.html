<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Escala Extra · PM</title>
<meta name="description" content="Controle de escalas extras e valores a receber da Polícia Militar.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1d33" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala PM">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f6fa;
    --ink:#1a2436; --muted:#6b7689; --line:#e4e8ef;
    --amber:#c8861a; --amber-soft:rgba(200,134,26,.14); --amber-bd:rgba(200,134,26,.42);
    --ok:#0b9e5e; --ok-soft:#e7f7ee; --ok-ink:#0b7a48;
    --danger:#dc2626; --danger-bd:#f1c4c4; --red:#dc2626;
    --header-bg:#0f1d33; --header-ink:#ffffff; --header-muted:#8aa0c4;
    --header-card:rgba(255,255,255,.07); --header-card-bd:rgba(255,255,255,.12);
    --shadow:0 8px 30px rgba(15,29,51,.10);
    --cell-bg:#ffffff;
  }
  [data-theme="dark"]{
    --bg:#0b1322; --surface:#16223a; --surface-2:#1d2c48;
    --ink:#e8eef7; --muted:#90a0bd; --line:#26334d;
    --amber:#e3a840; --amber-soft:rgba(227,168,64,.16); --amber-bd:rgba(227,168,64,.4);
    --ok:#34c787; --ok-soft:rgba(52,199,135,.14); --ok-ink:#5fd8a3;
    --danger:#f87171; --danger-bd:rgba(248,113,113,.35); --red:#f87171;
    --header-bg:#0a1120; --header-ink:#ffffff; --header-muted:#7e93b8;
    --header-card:rgba(255,255,255,.06); --header-card-bd:rgba(255,255,255,.1);
    --shadow:0 8px 30px rgba(0,0,0,.4);
    --cell-bg:#16223a;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    overscroll-behavior-y:none;
    transition:background .25s,color .25s;
  }
  #root{min-height:100%;}
  .cond{font-family:'Barlow Semi Condensed',sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }

  /* layout */
  .app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}

  /* header */
  .header{
    background:var(--header-bg); color:var(--header-ink);
    padding:calc(env(safe-area-inset-top) + 16px) 18px 18px;
    border-radius:0 0 20px 20px; box-shadow:var(--shadow);
  }
  .h-top{display:flex;align-items:center;justify-content:space-between;}
  .eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--header-muted);font-weight:600;}
  .h-title{font-size:27px;font-weight:700;margin:2px 0 0;line-height:1;}
  .h-title span{color:var(--header-muted);font-weight:600;}
  .h-actions{display:flex;gap:8px;}
  .icon-btn{
    width:40px;height:40px;display:grid;place-items:center;border-radius:11px;
    background:var(--header-card);color:#fff;border:1px solid var(--header-card-bd);
  }
  .icon-btn:active{transform:scale(.93);}

  .nav-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--header-card);color:var(--header-ink);border:1px solid var(--header-card-bd);
    border-radius:11px;padding:9px;font-size:13px;font-weight:600;}
  .nav-btn:active{transform:scale(.97);}

  .summary{display:flex;gap:9px;margin-top:14px;}
  .card{flex:1;background:var(--header-card);border:1px solid var(--header-card-bd);border-radius:13px;padding:11px 12px;}
  .card.accent{background:var(--amber-soft);border-color:var(--amber-bd);}
  .card .lbl{font-size:11px;color:var(--header-muted);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
  .card.accent .lbl{color:#e8c98a;}
  .card .val{font-size:19px;font-weight:700;line-height:1;color:#fff;}
  .card.accent .val{color:#f3d79a;}
  .card.ok .val{color:#7fd1a4;}

  .meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;}
  .meta-row .count{font-size:12.5px;color:var(--header-muted);display:flex;align-items:center;gap:5px;}
  .ghost{display:flex;align-items:center;gap:6px;background:var(--header-card);color:#cdd9ee;
    border:1px solid var(--header-card-bd);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;}

  /* calendar */
  .cal{padding:16px 12px calc(env(safe-area-inset-bottom) + 24px);flex:1;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px;}
  .wd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .wd.we{color:var(--red);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cell{
    position:relative;aspect-ratio:1/1.12;min-height:58px;padding:5px;background:var(--cell-bg);
    border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;
    text-align:left;color:var(--ink);transition:transform .08s;
  }
  .cell:active{transform:scale(.95);}
  .cell.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;}
  .cell .num{font-size:13px;font-weight:600;}
  .cell.we .num{color:var(--red);}
  .cell.holiday .num{color:var(--red);}
  .cell.today .num{color:var(--amber);}
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .dot.paid{opacity:.4;}
  .day-total{font-size:10.5px;font-weight:700;color:var(--amber);line-height:1;margin-top:3px;}

  .legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:6px 10px;}
  .chip .sw{width:9px;height:9px;border-radius:3px;}
  .chip .nm{font-size:12px;font-weight:600;}
  .chip .am{font-size:12px;color:var(--muted);}

  /* sheet */
  .overlay{position:fixed;inset:0;background:rgba(7,13,24,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:520px;max-height:90dvh;background:var(--bg);
    border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 44px rgba(7,13,24,.4);
    animation:rise .26s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom);}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.overlay,.sheet{animation:none}}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-size:19px;font-weight:700;margin:0;color:var(--ink);}
  .sheet-head .sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .sheet-body{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .sheet-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--line);}

  .mini-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);}
  .mini-btn.danger{color:var(--danger);border-color:var(--danger-bd);}
  .mini-btn:active{transform:scale(.93);}

  .esc-card{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--surface);
    border-left-width:4px;margin-bottom:10px;}
  .field-row{display:flex;gap:8px;align-items:center;}
  .input,.select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;color:var(--ink);background:var(--surface);}
  .select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7689' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;padding-right:34px;}
  .money-wrap{position:relative;flex:1;}
  .money-wrap .rs{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
  .money-wrap input{padding-left:35px;}
  .toggle{display:flex;align-items:center;gap:6px;padding:10px 13px;border-radius:10px;font-size:12.5px;
    font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);}
  .toggle.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);}
  .obs{margin-top:9px;font-size:13px;}

  .btn-dashed{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;
    border-radius:11px;border:1.6px dashed var(--line);background:var(--surface);color:var(--ink);
    font-weight:600;font-size:13.5px;}
  .btn-dashed:active{transform:scale(.98);}
  .btn-primary{background:var(--amber);color:#1a1206;border:none;border-radius:11px;padding:12px 28px;
    font-size:14.5px;font-weight:700;}
  .btn-primary:active{transform:scale(.97);}
  .foot-total .t1{font-size:11.5px;color:var(--muted);}
  .foot-total .t2{font-size:21px;font-weight:700;color:var(--amber);}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 8px;line-height:1.6;}

  .type-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:13px;
    padding:9px;background:var(--surface);margin-bottom:9px;}
  .swatch{position:relative;width:36px;height:36px;flex:none;border-radius:9px;border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--line);overflow:hidden;}
  .swatch input{position:absolute;inset:-4px;width:130%;height:130%;border:none;padding:0;cursor:pointer;}
  .hint{font-size:12px;color:var(--muted);margin:4px 4px 0;line-height:1.5;}

  .install-banner{display:flex;align-items:center;gap:10px;background:var(--amber-soft);
    border:1px solid var(--amber-bd);border-radius:13px;padding:11px 13px;margin:14px 12px 0;}
  .install-banner .txt{flex:1;font-size:12.5px;color:var(--ink);}
  .install-banner .txt b{color:var(--amber);}
  .install-banner button{background:var(--amber);color:#1a1206;border:none;border-radius:9px;
    padding:8px 14px;font-weight:700;font-size:12.5px;}

  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px;border-radius:8px;
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  [data-theme="dark"] .seg button.active{background:var(--header-bg);color:#fff;}

  /* ---- marcações (pré-confirmação) ---- */
  .dot.mark{box-shadow:0 0 0 1px rgba(15,29,51,.18) inset;}
  [data-theme="dark"] .dot.mark{box-shadow:none;}
  .meta-row .count b{color:#cdd9ee;font-weight:600;}
  .meta-row{flex-wrap:wrap;gap:6px 12px;}

  .modebar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:1px;}
  .modebar::-webkit-scrollbar{display:none;}
  .modebar button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;}
  .modebar button .sw{width:10px;height:10px;border-radius:50%;}
  .modebar button.active{color:var(--ink);border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;}
  .mode-hint{font-size:12px;color:var(--muted);margin:-4px 2px 10px;}
  .grid.marking .cell{border-style:dashed;}

  .esc-card.marcada{border-style:dashed;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:99px;}
  .mark-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .btn-ok{display:flex;align-items:center;gap:6px;background:var(--ok);color:#fff;border:none;border-radius:10px;
    padding:10px 14px;font-weight:700;font-size:13px;white-space:nowrap;}
  .btn-ok:active{transform:scale(.97);}
  .add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .btn-mark{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border-radius:11px;
    border:1.6px dashed;font-weight:600;font-size:13px;color:var(--ink);}
  .btn-mark:active{transform:scale(.98);}
  .foot-total .t3{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .chip.mk{border-style:dashed;}

  .row-btns{display:flex;gap:8px;}
  .row-btns .btn-dashed{flex:1;}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
    background:var(--header-bg);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;
    box-shadow:var(--shadow);z-index:80;animation:fade .18s ease;white-space:nowrap;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- icons ---------- */
const Ic = (p) => React.createElement("svg",{width:p.s||20,height:p.s||20,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:p.w||2,strokeLinecap:"round",strokeLinejoin:"round"},p.children);
const Left=(p)=><Ic {...p}><polyline points="15 18 9 12 15 6"/></Ic>;
const Right=(p)=><Ic {...p}><polyline points="9 18 15 12 9 6"/></Ic>;
const Plus=(p)=><Ic {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ic>;
const X=(p)=><Ic {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Ic>;
const Trash=(p)=><Ic {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Ic>;
const Check=(p)=><Ic {...p}><polyline points="20 6 9 17 4 12"/></Ic>;
const Gear=(p)=><Ic {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.2.61.78 1.05 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></Ic>;
const Sun=(p)=><Ic {...p}><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></Ic>;
const Moon=(p)=><Ic {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></Ic>;
const WalletI=(p)=><Ic {...p}><path d="M20 12V8a2 2 0 0 0-2-2H5a1 1 0 0 1 0-2h13"/><path d="M3 6v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-4a2 2 0 0 0 0 4h4"/></Ic>;
const CalI=(p)=><Ic {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Ic>;
const Flag=(p)=><Ic {...p}><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></Ic>;
const Down=(p)=><Ic {...p}><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></Ic>;
const Up=(p)=><Ic {...p}><path d="M12 21V9"/><polyline points="7 14 12 9 17 14"/><path d="M5 3h14"/></Ic>;

/* ---------- helpers ---------- */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const brl=(v)=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Math.random().toString(36).slice(2,9);
const mkey=(a,m)=>`escala:mes:${a}-${String(m+1).padStart(2,"0")}`;

/* marcada = escala prevista, ainda não confirmada (não entra nos valores) */
const ehMarcada=(e)=>e.status==="marcada";

/* cor clara da marcação: mistura a cor do tipo com branco */
function corClara(hex,f=0.55){
  const h=(hex||"#94a3b8").replace("#","");
  const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const mx=(c)=>Math.round(c+(255-c)*f);
  return `rgb(${mx(r)},${mx(g)},${mx(b)})`;
}
/* azul claro p/ DEJEM, verde claro p/ Delegada; demais tipos usam a cor clareada */
const MARCA_FIXA={dejem:"#93c5fd",delegada:"#86efac"};
const corMarca=(t)=>MARCA_FIXA[t?.id]||corClara(t?.cor);

/* ---- feriados ---- */
function pascoa(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);
}
const addDias=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x;};
/* retorna { "mes-dia": "Nome" } com mes em base 0 */
function mapaFeriados(ano){
  const p=pascoa(ano);
  const movel=[
    [addDias(p,-48),"Carnaval"],
    [addDias(p,-47),"Carnaval"],
    [addDias(p,-2),"Sexta-feira Santa"],
    [addDias(p,60),"Corpus Christi"],
  ];
  const fixos=[
    [0,1,"Confraternização Universal"],
    [0,25,"Aniversário de São Paulo"],
    [3,21,"Tiradentes"],
    [4,1,"Dia do Trabalho"],
    [6,9,"Revolução Constitucionalista"],
    [8,7,"Independência do Brasil"],
    [9,12,"Nossa Senhora Aparecida"],
    [10,2,"Finados"],
    [10,15,"Proclamação da República"],
    [10,20,"Consciência Negra"],
    [11,25,"Natal"],
  ];
  const m={};
  fixos.forEach(([mes,dia,nome])=>{m[`${mes}-${dia}`]=nome;});
  movel.forEach(([dt,nome])=>{m[`${dt.getMonth()}-${dt.getDate()}`]=nome;});
  return m;
}
const PALETA=["#2563eb","#059669","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#475569"];
const TIPOS_PADRAO=[
  {id:"dejem",nome:"DEJEM",cor:"#2563eb",valor:307.36},
  {id:"delegada",nome:"Delegada",cor:"#059669",valor:479.44},
];

const ls={
  get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch{return f;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

/* ---------- App ---------- */
function App(){
  const hoje=new Date();
  const [ano,setAno]=useState(hoje.getFullYear());
  const [mes,setMes]=useState(hoje.getMonth());
  const [tipos,setTipos]=useState(()=>ls.get("escala:tipos",TIPOS_PADRAO));
  const [dados,setDados]=useState(()=>ls.get(mkey(hoje.getFullYear(),hoje.getMonth()),{}));
  const [diaSel,setDiaSel]=useState(null);
  const [tela,setTela]=useState(null); // 'tipos'
  const [tema,setTema]=useState(()=>ls.get("escala:tema","light"));
  const [deferred,setDeferred]=useState(null);
  const [modo,setModo]=useState(null); // null = abrir dia | id do tipo = marcar rápido
  const [toast,setToast]=useState("");
  const toastRef=useRef(null);

  /* tema */
  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",tema);
    const mt=document.getElementById("meta-theme");
    if(mt) mt.setAttribute("content", tema==="dark"?"#0a1120":"#0f1d33");
    ls.set("escala:tema",tema);
  },[tema]);

  /* carregar mês */
  useEffect(()=>{ setDados(ls.get(mkey(ano,mes),{})); },[ano,mes]);

  /* install prompt */
  useEffect(()=>{
    const h=(e)=>{e.preventDefault();setDeferred(e);};
    window.addEventListener("beforeinstallprompt",h);
    return ()=>window.removeEventListener("beforeinstallprompt",h);
  },[]);

  /* se o tipo do modo foi removido, volta ao normal */
  useEffect(()=>{ if(modo && !tipos.some(t=>t.id===modo)) setModo(null); },[tipos,modo]);

  const avisar=(msg)=>{setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(""),1800);};

  const salvarTipos=useCallback((n)=>{setTipos(n);ls.set("escala:tipos",n);},[]);
  const salvarMes=useCallback((n)=>{setDados(n);ls.set(mkey(ano,mes),n);},[ano,mes]);
  const tipoPor=useCallback((id)=>tipos.find(t=>t.id===id)||{nome:"—",cor:"#94a3b8",valor:0},[tipos]);

  const irMes=(d)=>{let m=mes+d,a=ano;if(m<0){m=11;a--;}if(m>11){m=0;a++;}setMes(m);setAno(a);};

  const grade=useMemo(()=>{
    const ini=new Date(ano,mes,1).getDay();
    const td=new Date(ano,mes+1,0).getDate();
    const c=[];for(let i=0;i<ini;i++)c.push(null);
    for(let d=1;d<=td;d++)c.push(d);
    while(c.length%7)c.push(null);return c;
  },[ano,mes]);

  const resumo=useMemo(()=>{
    let total=0,rec=0,qtd=0,mq=0,prev=0;const pt={},pm={};
    Object.values(dados).forEach(l=>l.forEach(e=>{
      if(ehMarcada(e)){
        mq++;prev+=Number(tipoPor(e.tipoId).valor)||0;
        pm[e.tipoId]=(pm[e.tipoId]||0)+1;
        return;
      }
      const v=Number(e.valor)||0;total+=v;qtd++;if(e.recebido)rec+=v;
      pt[e.tipoId]=(pt[e.tipoId]||0)+v;
    }));
    return {total,rec,pend:total-rec,qtd,pt,mq,prev,pm};
  },[dados,tipoPor]);

  const ehHoje=(d)=>d===hoje.getDate()&&mes===hoje.getMonth()&&ano===hoje.getFullYear();
  const totDia=(d)=>(dados[d]||[]).filter(e=>!ehMarcada(e)).reduce((s,e)=>s+(Number(e.valor)||0),0);
  const ehFds=(i)=>i%7===0||i%7===6;
  const feriados=useMemo(()=>mapaFeriados(ano),[ano]);
  const feriadoDe=(d)=>feriados[`${mes}-${d}`];

  /* marcação rápida: toque no dia liga/desliga a marcação do tipo escolhido */
  const alternarMarca=(d,tipoId)=>{
    const t=tipoPor(tipoId);
    const lista=dados[d]||[];
    const idx=lista.findIndex(e=>ehMarcada(e)&&e.tipoId===tipoId);
    let nova;
    if(idx>=0){
      nova=lista.filter((_,i)=>i!==idx);
      avisar(`${t.nome} desmarcada · ${d}/${String(mes+1).padStart(2,"0")}`);
    }else{
      nova=[...lista,{id:uid(),tipoId,status:"marcada",valor:"",recebido:false,obs:""}];
      avisar(`${t.nome} marcada · ${d}/${String(mes+1).padStart(2,"0")}`);
    }
    const n={...dados};
    if(nova.length)n[d]=nova;else delete n[d];
    salvarMes(n);
  };

  const tocarDia=(d)=>{ if(modo) alternarMarca(d,modo); else setDiaSel(d); };

  const instalar=async()=>{ if(!deferred)return; deferred.prompt(); await deferred.userChoice; setDeferred(null); };

  const modoTipo=modo?tipoPor(modo):null;

  return (
   <div className="app">
    <header className="header">
      <div className="h-top">
        <div>
          <div className="eyebrow">Escala Extra · PM</div>
          <h1 className="cond h-title">{MESES[mes]} <span>{ano}</span></h1>
        </div>
        <div className="h-actions">
          <button className="icon-btn" onClick={()=>setTema(tema==="dark"?"light":"dark")} aria-label="Alternar tema">
            {tema==="dark"?<Sun s={19}/>:<Moon s={19}/>}
          </button>
          <button className="icon-btn" onClick={()=>setTela("tipos")} aria-label="Ajustes"><Gear s={19}/></button>
        </div>
      </div>

      <div className="nav-row">
        <button className="nav-btn" onClick={()=>irMes(-1)}><Left s={17}/> Anterior</button>
        <button className="nav-btn" onClick={()=>{setMes(hoje.getMonth());setAno(hoje.getFullYear());}}>Hoje</button>
        <button className="nav-btn" onClick={()=>irMes(1)}>Próximo <Right s={17}/></button>
      </div>

      <div className="summary">
        <div className="card accent"><div className="lbl"><WalletI s={14}/> A receber</div><div className="val num">{brl(resumo.total)}</div></div>
        <div className="card"><div className="lbl">Pendente</div><div className="val num">{brl(resumo.pend)}</div></div>
        <div className="card ok"><div className="lbl">Recebido</div><div className="val num">{brl(resumo.rec)}</div></div>
      </div>

      <div className="meta-row">
        <span className="count"><CalI s={13}/> {resumo.qtd} {resumo.qtd===1?"confirmada":"confirmadas"}</span>
        {resumo.mq>0 &&
          <span className="count"><Flag s={13}/> {resumo.mq} {resumo.mq===1?"marcada":"marcadas"} · <b className="num">previsão {brl(resumo.prev)}</b></span>}
      </div>
    </header>

    {deferred &&
      <div className="install-banner">
        <div className="txt"><b>Instalar no celular</b> — acesso rápido e uso offline.</div>
        <button onClick={instalar}>Instalar</button>
      </div>}

    <main className="cal">
      <div className="modebar" role="group" aria-label="Ao tocar no dia">
        <button className={modo===null?"active":""} onClick={()=>setModo(null)}>Abrir dia</button>
        {tipos.map(t=>
          <button key={t.id} className={modo===t.id?"active":""} onClick={()=>setModo(modo===t.id?null:t.id)}>
            <span className="sw" style={{background:corMarca(t)}}/> Marcar {t.nome}
          </button>)}
      </div>
      {modoTipo &&
        <p className="mode-hint">Toque nos dias para marcar ou desmarcar <b>{modoTipo.nome}</b>. Para confirmar e lançar o valor, volte em <b>Abrir dia</b>.</p>}

      <div className="weekdays">
        {WD.map((d,i)=><div key={d} className={"wd"+((i===0||i===6)?" we":"")}>{d}</div>)}
      </div>
      <div className={"grid"+(modo?" marking":"")}>
        {grade.map((d,i)=>{
          if(d===null) return <div key={i}/>;
          const lista=dados[d]||[];const t=totDia(d);const fer=feriadoDe(d);
          const nm=lista.filter(ehMarcada).length;
          return (
            <button key={i} className={"cell"+(ehHoje(d)?" today":"")+((ehFds(i)||fer)?" we":"")+(fer?" holiday":"")}
              onClick={()=>tocarDia(d)} title={fer||undefined}
              aria-label={`Dia ${d}${fer?", "+fer:""}, ${lista.length-nm} confirmadas, ${nm} marcadas, ${brl(t)}`}>
              <span className="num">{d}</span>
              <div className="dots">
                {lista.slice(0,4).map(e=>{
                  const tp=tipoPor(e.tipoId);
                  return ehMarcada(e)
                    ? <span key={e.id} className="dot mark" style={{background:corMarca(tp)}}/>
                    : <span key={e.id} className={"dot"+(e.recebido?" paid":"")} style={{background:tp.cor}}/>;
                })}
              </div>
            </button>
          );
        })}
      </div>

      {(Object.keys(resumo.pt).length>0 || resumo.mq>0) &&
        <div className="legend">
          {tipos.filter(t=>resumo.pt[t.id]).map(t=>
            <div key={t.id} className="chip">
              <span className="sw" style={{background:t.cor}}/>
              <span className="nm">{t.nome}</span>
              <span className="am num">{brl(resumo.pt[t.id])}</span>
            </div>)}
          {tipos.filter(t=>resumo.pm[t.id]).map(t=>
            <div key={"m"+t.id} className="chip mk">
              <span className="sw" style={{background:corMarca(t)}}/>
              <span className="nm">{t.nome} marcada</span>
              <span className="am num">×{resumo.pm[t.id]}</span>
            </div>)}
        </div>}
    </main>

    {diaSel!==null &&
      <ModalDia dia={diaSel} mes={mes} ano={ano} escalas={dados[diaSel]||[]} tipos={tipos} feriado={feriadoDe(diaSel)}
        onFechar={()=>setDiaSel(null)}
        onSalvar={(l)=>{const n={...dados};if(l.length)n[diaSel]=l;else delete n[diaSel];salvarMes(n);}}/>}

    {tela==="tipos" &&
      <ModalTipos tipos={tipos} tema={tema} setTema={setTema}
        onFechar={()=>setTela(null)} onSalvar={salvarTipos}/>}

    {toast && <div className="toast" role="status">{toast}</div>}
   </div>
  );
}

/* ---------- Bottom sheet ---------- */
function Sheet({titulo,sub,children,foot,onFechar}){
  useEffect(()=>{const k=(e)=>e.key==="Escape"&&onFechar();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);},[onFechar]);
  return (
   <div className="overlay" onClick={onFechar}>
    <div className="sheet" onClick={(e)=>e.stopPropagation()}>
      <div className="grab"/>
      <div className="sheet-head">
        <div><h2 className="cond">{titulo}</h2>{sub&&<div className="sub">{sub}</div>}</div>
        <button className="mini-btn" onClick={onFechar} aria-label="Fechar"><X s={18}/></button>
      </div>
      <div className="sheet-body">{children}</div>
      {foot && <div className="sheet-foot">{foot}</div>}
    </div>
   </div>
  );
}

/* ---------- Modal dia ---------- */
function ModalDia({dia,mes,ano,escalas,tipos,feriado,onFechar,onSalvar}){
  const [lista,setLista]=useState(()=>escalas.map(e=>({...e})));
  const tipoPor=(id)=>tipos.find(t=>t.id===id)||tipos[0];
  const add=()=>{const t=tipos[0];setLista([...lista,{id:uid(),tipoId:t.id,status:"confirmada",valor:t.valor||"",recebido:false,obs:""}]);};
  const marcar=(t)=>setLista([...lista,{id:uid(),tipoId:t.id,status:"marcada",valor:"",recebido:false,obs:""}]);
  const confirmar=(item)=>{
    const t=tipoPor(item.tipoId);
    setLista(lista.map(e=>e.id===item.id?{...e,status:"confirmada",valor:t?.valor??""}:e));
  };
  const upd=(id,c,v)=>setLista(lista.map(e=>e.id===id?{...e,[c]:v}:e));
  const mudarTipo=(item,novoId)=>{
    const anterior=tipos.find(t=>t.id===item.tipoId);
    const novo=tipos.find(t=>t.id===novoId);
    if(ehMarcada(item)){ setLista(lista.map(e=>e.id===item.id?{...e,tipoId:novoId}:e)); return; }
    const vazio=item.valor===""||item.valor===null||item.valor===undefined;
    const eraPadrao=vazio||Number(item.valor)===Number(anterior?.valor||0);
    setLista(lista.map(e=>e.id===item.id
      ?{...e,tipoId:novoId,valor:eraPadrao?(novo?.valor??""):e.valor}
      :e));
  };
  const del=(id)=>setLista(lista.filter(e=>e.id!==id));
  const salvar=()=>{onSalvar(lista.filter(e=>e.tipoId).map(e=>({...e,valor:ehMarcada(e)?"":(Number(e.valor)||0)})));onFechar();};
  const confirmadas=lista.filter(e=>!ehMarcada(e));
  const marcadas=lista.filter(ehMarcada);
  const total=confirmadas.reduce((s,e)=>s+(Number(e.valor)||0),0);
  const previsto=marcadas.reduce((s,e)=>s+(Number(tipoPor(e.tipoId)?.valor)||0),0);
  const diaSemana=WD[new Date(ano,mes,dia).getDay()];

  return (
   <Sheet titulo={`${dia} de ${MESES[mes]}`} sub={feriado?`${diaSemana} · ${feriado}`:diaSemana} onFechar={onFechar}
     foot={<>
       <div className="foot-total">
         <div className="t1">Total do dia</div>
         <div className="t2 num">{brl(total)}</div>
         {marcadas.length>0 && <div className="t3 num">+ {brl(previsto)} previsto ({marcadas.length} {marcadas.length===1?"marcada":"marcadas"})</div>}
       </div>
       <button className="btn-primary" onClick={salvar}>Salvar</button>
     </>}>
     {lista.length===0 &&
       <p className="empty">Nenhuma escala neste dia.<br/>Use <b>Marcar</b> para deixar a escala prevista, ou <b>Adicionar escala confirmada</b> para lançar com valor.</p>}
     {lista.map(e=>{
       const t=tipoPor(e.tipoId);
       if(ehMarcada(e)){
         const clara=corMarca(t);
         return (
          <div key={e.id} className="esc-card marcada" style={{borderLeftColor:clara,borderColor:clara}}>
            <div className="field-row" style={{marginBottom:9}}>
              <span className="badge" style={{background:corClara(t?.cor,.82),color:t?.cor}}><Flag s={12}/> Marcada</span>
              <select className="select" value={e.tipoId} onChange={(ev)=>mudarTipo(e,ev.target.value)}>
                {tipos.map(tp=><option key={tp.id} value={tp.id}>{tp.nome}</option>)}
              </select>
              <button className="mini-btn danger" onClick={()=>del(e.id)} aria-label="Remover marcação"><Trash s={16}/></button>
            </div>
            <input className="input obs" style={{marginTop:0}} placeholder="Observação (local, horário...)"
              value={e.obs||""} onChange={(ev)=>upd(e.id,"obs",ev.target.value)}/>
            <div className="mark-row">
              <span className="hint" style={{margin:0,flex:1}}>Prevista · ainda não entra nos valores</span>
              <button className="btn-ok" onClick={()=>confirmar(e)}><Check s={15}/> Confirmar</button>
            </div>
          </div>
         );
       }
       return (
        <div key={e.id} className="esc-card" style={{borderLeftColor:t?.cor||"#94a3b8"}}>
          <div className="field-row" style={{marginBottom:9}}>
            <select className="select" value={e.tipoId} onChange={(ev)=>mudarTipo(e,ev.target.value)}>
              {tipos.map(tp=><option key={tp.id} value={tp.id}>{tp.nome}</option>)}
            </select>
            <button className="mini-btn danger" onClick={()=>del(e.id)} aria-label="Remover"><Trash s={16}/></button>
          </div>
          <div className="field-row">
            <div className="money-wrap"><span className="rs">R$</span>
              <input className="input num" type="number" inputMode="decimal" placeholder="0,00"
                value={e.valor} onChange={(ev)=>upd(e.id,"valor",ev.target.value)}/>
            </div>
            <button className={"toggle"+(e.recebido?" on":"")} onClick={()=>upd(e.id,"recebido",!e.recebido)}>
              <Check s={15}/> {e.recebido?"Recebido":"Receber"}
            </button>
          </div>
          <input className="input obs" placeholder="Observação (local, horário...)"
            value={e.obs||""} onChange={(ev)=>upd(e.id,"obs",ev.target.value)}/>
        </div>
       );
     })}
     <div className="add-grid">
       {tipos.map(t=>
         <button key={t.id} className="btn-mark" onClick={()=>marcar(t)}
           style={{borderColor:corMarca(t),background:corClara(t.cor,.86)}}>
           <Flag s={15}/> Marcar {t.nome}
         </button>)}
     </div>
     <button className="btn-dashed" onClick={add}><Plus s={17}/> Adicionar escala confirmada</button>
   </Sheet>
  );
}

/* ---------- backup ---------- */
function exportarBackup(){
  const out={app:"escala-pm",versao:2,data:new Date().toISOString(),chaves:{}};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith("escala:")) out.chaves[k]=localStorage.getItem(k);
  }
  const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`escala-pm-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importarBackup(arquivo){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.app!=="escala-pm"||!j.chaves) throw new Error("formato");
      const n=Object.keys(j.chaves).length;
      if(!window.confirm(`Restaurar ${n} registros do backup? Os dados atuais deste aparelho serão substituídos.`)) return;
      Object.keys(localStorage).filter(k=>k.startsWith("escala:")).forEach(k=>localStorage.removeItem(k));
      Object.entries(j.chaves).forEach(([k,v])=>{ if(k.startsWith("escala:")) localStorage.setItem(k,v); });
      location.reload();
    }catch{ window.alert("Arquivo de backup inválido."); }
  };
  r.readAsText(arquivo);
}

/* ---------- Modal tipos + tema + backup ---------- */
function ModalTipos({tipos,tema,setTema,onFechar,onSalvar}){
  const [lista,setLista]=useState(()=>tipos.map(t=>({...t})));
  const inputRef=useRef(null);
  const add=()=>setLista([...lista,{id:uid(),nome:"",cor:PALETA[lista.length%PALETA.length],valor:""}]);
  const upd=(id,c,v)=>setLista(lista.map(t=>t.id===id?{...t,[c]:v}:t));
  const del=(id)=>setLista(lista.filter(t=>t.id!==id));
  const salvar=()=>{const lp=lista.filter(t=>(t.nome||"").trim()).map(t=>({...t,nome:t.nome.trim(),valor:Number(t.valor)||0}));if(lp.length)onSalvar(lp);onFechar();};
  const tituloSecao={margin:"0 2px 8px",fontWeight:600,color:"var(--ink)",fontSize:13};

  return (
   <Sheet titulo="Ajustes" sub="Tipos de escala, aparência e backup" onFechar={onFechar}
     foot={<>
       <span style={{fontSize:12.5,color:"var(--muted)"}}>{lista.length} tipos</span>
       <button className="btn-primary" onClick={salvar}>Salvar</button>
     </>}>
     <div style={{marginBottom:18}}>
       <div className="hint" style={tituloSecao}>Tema</div>
       <div className="seg">
         <button className={tema==="light"?"active":""} onClick={()=>setTema("light")}><Sun s={16}/> Claro</button>
         <button className={tema==="dark"?"active":""} onClick={()=>setTema("dark")}><Moon s={16}/> Escuro</button>
       </div>
     </div>

     <div className="hint" style={tituloSecao}>Tipos de escala</div>
     {lista.map(t=>
       <div key={t.id} className="type-row">
         <label className="swatch" style={{background:t.cor}}>
           <input type="color" value={t.cor} onChange={(e)=>upd(t.id,"cor",e.target.value)}/>
         </label>
         <input className="input" placeholder="Nome (ex: DEJEM)" value={t.nome} onChange={(e)=>upd(t.id,"nome",e.target.value)} style={{flex:1}}/>
         <div className="money-wrap" style={{width:108,flex:"none"}}><span className="rs">R$</span>
           <input className="input num" type="number" inputMode="decimal" placeholder="padrão"
             value={t.valor} onChange={(e)=>upd(t.id,"valor",e.target.value)}/>
         </div>
         <button className="mini-btn danger" onClick={()=>del(t.id)} aria-label="Remover tipo"><Trash s={16}/></button>
       </div>)}
     <button className="btn-dashed" onClick={add}><Plus s={17}/> Novo tipo</button>
     <p className="hint">O valor padrão é uma sugestão para agilizar o lançamento — você ajusta em cada dia. A marcação usa a versão clara da cor do tipo.</p>

     <div style={{marginTop:20}}>
       <div className="hint" style={tituloSecao}>Backup</div>
       <div className="row-btns">
         <button className="btn-dashed" onClick={exportarBackup}><Down s={16}/> Exportar</button>
         <button className="btn-dashed" onClick={()=>inputRef.current?.click()}><Up s={16}/> Importar</button>
       </div>
       <input ref={inputRef} type="file" accept="application/json,.json" style={{display:"none"}}
         onChange={(e)=>{const f=e.target.files?.[0];if(f)importarBackup(f);e.target.value="";}}/>
       <p className="hint">Os dados ficam só neste aparelho. Exporte de vez em quando para não perder nada ao trocar de celular ou limpar o navegador.</p>
     </div>
   </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
